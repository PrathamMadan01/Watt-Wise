# =============================================================================
# WattWise — CD Pipeline
# Deploys the Azure Function (EventHub → CosmosDB) and the Streamlit Dashboard
# =============================================================================

name: "CD — Deploy to Azure"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  AZURE_FUNCTIONAPP_NAME: "telemetry-funcapp"
  FUNCTION_APP_PATH: "./function_app"
  DOCKER_IMAGE_NAME: "wattwise-app"

jobs:
  # ─────────────────────────────────────────────────
  # 1. Deploy Azure Function (EventHub → CosmosDB)
  #    Uses 'az functionapp deploy' for Flex Consumption
  # ─────────────────────────────────────────────────
  deploy-function:
    name: "⚡ Deploy Azure Function"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install function dependencies"
        run: |
          pushd "${{ env.FUNCTION_APP_PATH }}"
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          popd

      - name: "📁 Package function app"
        run: |
          cd ${{ env.FUNCTION_APP_PATH }}
          zip -r ../function-app.zip . \
            -x ".venv/*" ".env" "app.py" "simulator.py" \
               "tempCodeRunnerFile.python" "__pycache__/*" ".vscode/*"

      - name: "🔐 Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "🚀 Deploy to Azure Functions (Flex Consumption)"
        run: |
          az functionapp deployment source config-zip \
            --resource-group Watt-Wise \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --src function-app.zip

  # ─────────────────────────────────────────────────
  # 2. Build & Push Docker Image + Deploy Dashboard
  #    Builds locally on GitHub Actions, pushes to ACR
  # ─────────────────────────────────────────────────
  deploy-dashboard:
    name: "📊 Deploy Streamlit Dashboard"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔐 Login to Azure Container Registry"
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: "🐳 Build & Push Docker image"
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: "🔐 Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "🌐 Deploy to Azure Container Instance"
        run: |
          # Delete existing container if it exists (idempotent)
          az container delete \
            --resource-group Watt-Wise \
            --name wattwise-dashboard \
            --yes 2>/dev/null || true

          # Deploy new container
          az container create \
            --resource-group Watt-Wise \
            --name wattwise-dashboard \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            --os-type Linux \
            --cpu 1 --memory 1.5 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label wattwise-dashboard \
            --ports 8501 \
            --location malaysiawest \
            --environment-variables \
              COSMOS_URL=${{ secrets.COSMOS_URL }} \
              COSMOS_KEY=${{ secrets.COSMOS_KEY }} \
              DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              CONTAINER_NAME=${{ secrets.CONTAINER_NAME }}

          echo "🌐 Dashboard URL: http://wattwise-dashboard.malaysiawest.azurecontainer.io:8501"
