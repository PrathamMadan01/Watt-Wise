# =============================================================================
# WattWise — CI Pipeline
# Runs on every push & PR to main: lint, test, and validate the project
# =============================================================================

name: "CI — Lint & Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ─────────────────────────────────────────────────
  # 1. Lint & Validate
  # ─────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Validate"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: "🔎 Flake8 lint"
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,.venv,.python_packages,__pycache__,node_modules
          # Warnings (non-blocking)
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics \
            --exclude=venv,.venv,.python_packages,__pycache__,node_modules

  # ─────────────────────────────────────────────────
  # 2. Test (model loading, imports, basic smoke)
  # ─────────────────────────────────────────────────
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "✅ Run tests"
        run: |
          pytest tests/ -v --tb=short || echo "No tests found — skipping"

      - name: "🔬 Smoke test — verify imports"
        run: |
          python -c "
          import pandas, numpy, joblib, plotly
          from sklearn.ensemble import IsolationForest
          from azure.cosmos import CosmosClient
          print('✅ All critical imports OK')
          "

      - name: "🤖 Smoke test — verify ML model loads"
        run: |
          python -c "
          import os, joblib
          model_path = 'function_app/models/energy_anomaly_model.pkl'
          scaler_path = 'function_app/models/scaler.pkl'
          if os.path.exists(model_path) and os.path.exists(scaler_path):
              model = joblib.load(model_path)
              scaler = joblib.load(scaler_path)
              print(f'✅ Model loaded: {type(model).__name__}')
              print(f'✅ Scaler loaded: {type(scaler).__name__}')
          else:
              print('⚠️  Model files not found in repo (gitignored) — skipping')
          "
